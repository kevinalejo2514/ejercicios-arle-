<h2>Tu pedido: {{ carrito.cantidad() }}</h2>
@if (carrito.cantidad() === 0) {
  <p>Elige algo del menú</p>
}
<ul>
  @for (p of carrito.lista(); track $index) {
    <app-item-pedido
      [producto]="p"
      (quitar)="carrito.quitar($event)"
    />
  }
</ul>
<p>Total: ${{ carrito.total() }}</p>
<button (click)="carrito.vaciar()">Vaciar</button>
